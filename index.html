function renderTodos(){var c=document.getElementById('module-todos');var total=S.todos.length,active=S.todos.filter(function(t){return!t.completed;}).length,od=S.todos.filter(isOverdue).length;var h='<div class="module-header"><h2>待办事项</h2><span class="data-count-badge">'+active+'/'+total+'</span>';if(od)h+=' <span class="badge badge-high">'+od+'逾期</span>';h+='<div class="spacer"></div><button class="btn btn-outline btn-sm" data-action="export-todos">导出</button><button class="btn btn-primary btn-sm" data-action="add-todo">+ 新增</button></div>';h+='<div class="todo-filters">';['all','active','completed'].forEach(function(f){var lb={all:'全部',active:'进行中',completed:'已完成'}[f];h+='<div class="todo-filter'+(U.todoFilter===f?' active':'')+'" data-action="filter-todo" data-val="'+f+'">'+lb+'</div>';});h+='</div>';var fl=S.todos.filter(function(t){if(U.todoFilter==='active')return!t.completed;if(U.todoFilter==='completed')return t.completed;return true;}).sort(function(a,b){if(a.completed!==b.completed)return a.completed?1:-1;return(a.deadline||'9999')>(b.deadline||'9999')?1:-1;});if(!fl.length){h+='<div class="empty-state"><p>暂无待办</p><button class="btn btn-primary" data-action="add-todo">新增待办</button></div>';}else{h+='<div class="todo-list">';fl.forEach(function(t){var od=isOverdue(t);h+='<div class="todo-item '+(t.completed?'completed ':' ')+t.priority+(od?' overdue':'')+'"><div class="todo-check'+(t.completed?' checked':'')+'" data-action="toggle-todo" data-id="'+t.id+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg></div><div class="todo-content"><div class="todo-title">'+esc(t.title)+'</div>'+(t.content?'<div class="todo-desc">'+esc(t.content)+'</div>':'')+'<div class="todo-meta"><span class="badge badge-blue">'+({teaching:'教学',class:'班级管理',communication:'家校沟通',other:'其他'}[t.category]||t.category)+'</span><span class="badge badge-'+t.priority+'">'+({high:'紧急',medium:'重要',low:'一般'}[t.priority])+'</span>'+(t.deadline?'<span class="todo-deadline'+(od?' overdue':'')+'">'+(od?'已逾期 · ':'')+fmtDate(t.deadline)+'</span>':'')+'</div></div><div class="todo-actions"><button data-action="edit-todo" data-id="'+t.id+'" title="编辑"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button><button data-action="delete-todo" data-id="'+t.id+'" title="删除"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button></div></div>';});h+='</div>';}c.innerHTML=h;}
function showTodoForm(t){var e=!!t;t=t||{title:'',content:'',deadline:todayStr(),priority:'medium',category:'teaching'};var b='<div class="form-group"><label>标题</label><input id="tf-title" value="'+esc(t.title)+'"></div><div class="form-group"><label>内容</label><textarea id="tf-content">'+esc(t.content)+'</textarea></div><div class="form-row"><div class="form-group"><label>截止时间</label><input type="date" id="tf-deadline" value="'+esc(t.deadline)+'"></div><div class="form-group"><label>优先级</label><select id="tf-priority"><option value="high"'+(t.priority==='high'?' selected':'')+'>紧急</option><option value="medium"'+(t.priority==='medium'?' selected':'')+'>重要</option><option value="low"'+(t.priority==='low'?' selected':'')+'>一般</option></select></div></div><div class="form-group"><label>分类</label><select id="tf-category"><option value="teaching"'+(t.category==='teaching'?' selected':'')+'>教学</option><option value="class"'+(t.category==='class'?' selected':'')+'>班级管理</option><option value="communication"'+(t.category==='communication'?' selected':'')+'>家校沟通</option><option value="other"'+(t.category==='other'?' selected':'')+'>其他</option></select></div>';openModal(e?'编辑待办':'新增待办',b,'<button class="btn btn-primary" data-action="save-todo" data-id="'+(t.id||'')+'">'+(e?'保存':'添加')+'</button><button class="btn btn-ghost" data-action="modal-close">取消</button>');}

function renderSchedule(){var c=document.getElementById('module-schedule');var days=['','周一','周二','周三','周四','周五'];var h='<div class="module-header"><h2>班级课表</h2><div style="display:flex;gap:6px"><button class="week-toggle-btn'+(S.settings.weekType==='single'?' active':'')+'" data-action="set-weektype" data-val="single">单周</button><button class="week-toggle-btn'+(S.settings.weekType==='double'?' active':'')+'" data-action="set-weektype" data-val="double">双周</button></div><div class="spacer"></div><button class="btn btn-outline btn-sm" data-action="import-schedule">导入</button><button class="btn btn-outline btn-sm no-print" onclick="window.print()">打印</button></div>';h+='<div style="overflow-x:auto"><table class="schedule-table"><thead><tr><th>节次</th>';for(var d=1;d<=5;d++)h+='<th>'+days[d]+'</th>';h+='</tr></thead><tbody>';for(var p=1;p<=8;p++){h+='<tr><td>第'+p+'节</td>';for(d=1;d<=5;d++){var it=getSchItem(d,p);var cls='';var ct='<div class="cell-subject" style="color:#ccc">+</div>';if(it){cls='has-item';if(S.settings.mySubjects.indexOf(it.subject)>=0)cls+=' my-subject';ct='<div class="cell-subject">'+esc(it.subject)+'</div>'+(it.class?'<div class="cell-class">'+esc(it.class)+'</div>':'');}h+='<td class="'+cls+'" data-action="edit-schedule" data-day="'+d+'" data-period="'+p+'">'+ct+'</td>';}h+='</tr>';}h+='</tbody></table></div><div style="margin-top:8px;font-size:12px;color:var(--text2)">蓝色高亮为我的课程（'+esc(S.settings.mySubjects.join('、'))+'），可在设置中修改</div>';c.innerHTML=h;}

function showSchForm(day,period){var it=getSchItem(day,period);var opts=S.settings.subjects.map(function(s){return'<option value="'+esc(s)+'"'+(it&&it.subject===s?' selected':'')+'>'+esc(s)+'</option>';}).join('');var b='<div class="form-row"><div class="form-group"><label>科目</label><select id="sf-subject"><option value="">- 清空 -</option>'+opts+'</select></div><div class="form-group"><label>班级</label><input id="sf-class" value="'+(it?esc(it.class):'')+'" placeholder="如：3班"></div></div><div class="form-group"><label>适用周次</label><select id="sf-weektype"><option value="both"'+(it&&it.weekType==='both'?' selected':'')+'>单双周通用</option><option value="single"'+(it&&it.weekType==='single'?' selected':'')+'>仅单周</option><option value="double"'+(it&&it.weekType==='double'?' selected':'')+'>仅双周</option></select></div>';openModal('编辑课表 · 第'+period+'节 '+['','周一','周二','周三','周四','周五'][day],b,'<button class="btn btn-primary" data-action="save-schedule" data-day="'+day+'" data-period="'+period+'">保存</button><button class="btn btn-ghost" data-action="modal-close">取消</button>');}
function saveSchedule(day,period){var sub=val('sf-subject');var cls=val('sf-class');var wt=val('sf-weektype');var idx=S.schedule.findIndex(function(s){return s.day===day&&s.period===period&&(s.weekType==='both'||s.weekType===S.settings.weekType);});if(!sub){if(idx>=0)S.schedule.splice(idx,1);}else{if(idx>=0){S.schedule[idx].subject=sub;S.schedule[idx].class=cls;S.schedule[idx].weekType=wt;}else S.schedule.push({id:uid(),day:day,period:period,subject:sub,class:cls,weekType:wt});}save();closeModal();renderSchedule();}
function showImportSch(){var b='<div class="form-group"><label>粘贴课表数据（从Excel复制）</label><textarea class="import-area" id="impSched" placeholder="节次,周一,周二,周三,周四,周五&#10;1,语文,数学,英语,物理,化学&#10;2,数学,语文,数学,语文,英语"></textarea></div><div class="import-hint">格式：每行一个节次，逗号或Tab分隔<br>示例：<code>1,语文,数学,英语,物理,化学</code></div>';openModal('导入课表',b,'<button class="btn btn-primary" data-action="do-import-schedule">导入</button><button class="btn btn-ghost" data-action="modal-close">取消</button>');}
function doImportSch(){var text=document.getElementById('impSched').value;if(!text.trim()){toast('请粘贴数据','error');return;}var rows=parseCSV(text);var cnt=0;rows.forEach(function(row){if(!row[0]||isNaN(parseInt(row[0])))return;var p=parseInt(row[0]);if(p<1||p>8)return;for(var d=1;d<=5&&d<row.length;d++){var sub=(row[d]||'').trim();if(!sub)continue;var idx=S.schedule.findIndex(function(s){return s.day===d&&s.period===p&&(s.weekType==='both'||s.weekType===S.settings.weekType);});if(idx>=0)S.schedule[idx].subject=sub;else S.schedule.push({id:uid(),day:d,period:p,subject:sub,class:'',weekType:'both'});cnt++;}});save();closeModal();renderSchedule();toast('已导入'+cnt+'节','success');}

function renderArrange(){var c=document.getElementById('module-arrange');var h='<div class="sub-tabs"><div class="sub-tab'+(U.arrangeTab==='seating'?' active':'')+'" data-action="set-arrange-tab" data-val="seating">座次表</div><div class="sub-tab'+(U.arrangeTab==='duty'?' active':'')+'" data-action="set-arrange-tab" data-val="duty">值日表</div></div>';c.innerHTML=h;if(U.arrangeTab==='seating')renderSeating();else renderDuty();}
function renderSeating(){var c=document.getElementById('module-arrange');var h='<div class="module-header"><h2>座次表</h2><div class="seating-dims"><span>行</span><input type="number" id="seatRows" value="'+S.seating.rows+'" min="1" max="10" style="width:40px;height:30px;border:1.5px solid var(--border);border-radius:6px;text-align:center"><span>列</span><input type="number" id="seatCols" value="'+S.seating.cols+'" min="1" max="10" style="width:40px;height:30px;border:1.5px solid var(--border);border-radius:6px;text-align:center"><button class="btn btn-outline btn-sm" data-action="resize-seating">应用</button></div><div class="spacer"></div><button class="btn btn-outline btn-sm" data-action="random-shuffle">随机换座</button><button class="btn btn-outline btn-sm no-print" onclick="window.print()">打印</button></div>';h+='<div class="seat-legend"><div class="legend-item"><span class="legend-dot" style="background:var(--blue-m-bg);border:2px solid #5B8DEE"></span>男生</div><div class="legend-item"><span class="legend-dot" style="background:var(--pink-f-bg);border:2px solid #FF85A2"></span>女生</div></div>';if(U.selectedSeat)h+='<div style="font-size:13px;color:var(--primary);margin-bottom:8px">已选中：'+esc(getStuName(U.selectedSeat))+'，点击目标位置调换</div>';h+='<div class="seating-wrap"><div class="podium">讲 台</div><div class="seat-grid" style="grid-template-columns:repeat('+S.seating.cols+',minmax(80px,1fr))">';for(var r=0;r<S.seating.rows;r++){for(var col=0;col<S.seating.cols;col++){var sid=S.seating.seats[r]&&S.seating.seats[r][col]?S.seating.seats[r][col]:null;var stu=sid?getStu(sid):null;var cls='seat '+(stu?(stu.gender==='男'?'male':'female'):'empty');if(sid===U.selectedSeat)cls+=' selected';h+='<div class="'+cls+'" data-action="click-seat" data-row="'+r+'" data-col="'+col+'"><span class="seat-num">'+(r*S.seating.cols+col+1)+'</span>'+(stu?'<div class="seat-name">'+esc(stu.name)+'</div><div class="seat-meta">第'+stu.group+'组</div>':'')+'</div>';}}h+='</div></div>';c.innerHTML+=h;}
function ensureSeats(){var sg=S.seating;if(!sg.seats)sg.seats=[];for(var r=0;r<sg.rows;r++){if(!sg.seats[r])sg.seats[r]=[];for(var c=0;c<sg.cols;c++){if(sg.seats[r][c]===undefined)sg.seats[r][c]=null;}}}
function handleSeat(r,col){ensureSeats();var cur=S.seating.seats[r]&&S.seating.seats[r][col]?S.seating.seats[r][col]:null;if(U.selectedSeat){if(cur===U.selectedSeat){U.selectedSeat=null;}else{for(var i=0;i<S.seating.rows;i++){for(var j=0;j<S.seating.cols;j++){if(S.seating.seats[i]&&S.seating.seats[i][j]===U.selectedSeat){S.seating.seats[i][j]=cur;break;}}}S.seating.seats[r][col]=U.selectedSeat;U.selectedSeat=null;save();}}else if(cur){U.selectedSeat=cur;}renderSeating();}
function resizeSeat(){var rows=Math.max(1,Math.min(10,parseInt(document.getElementById('seatRows').value)||5));var cols=Math.max(1,Math.min(10,parseInt(document.getElementById('seatCols').value)||6));var ids=[];for(var r=0;r<S.seating.seats.length;r++){if(S.seating.seats[r])for(var c=0;c<S.seating.seats[r].length;c++)if(S.seating.seats[r][c])ids.push(S.seating.seats[r][c]);}var ns=[],idx=0;for(r=0;r<rows;r++){ns[r]=[];for(c=0;c<cols;c++){ns[r][c]=idx<ids.length?ids[idx++]:null;}}S.seating={rows:rows,cols:cols,seats:ns};save();renderSeating();}
function randomShuffle(){ensureSeats();var ids=S.students.map(function(s){return s.id;});for(var i=ids.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=ids[i];ids[i]=ids[j];ids[j]=t;}var idx=0;for(var r=0;r<S.seating.rows;r++){for(var c=0;c<S.seating.cols;c++){S.seating.seats[r][c]=idx<ids.length?ids[idx++]:null;}}U.selectedSeat=null;save();renderSeating();toast('已随机排座','success');}
function renderDuty(){var c=document.getElementById('module-arrange');var ws=getWeekStr();var h='<div class="module-header"><h2>值日表</h2><select id="dutyWeekSel" style="border:1.5px solid var(--border);border-radius:8px;padding:6px 10px">';for(var w=-2;w<=4;w++){var d=new Date();d.setDate(d.getDate()+w*7);var y=d.getFullYear(),st=new Date(y,0,1),diff=(d-st)/86400000,wk=Math.ceil((diff+st.getDay()+1)/7);var ws2=y+'-W'+wk;h+='<option value="'+ws2+'"'+(ws2===ws?' selected':'')+'>'+y+'第'+wk+'周</option>';}h+='</select><div class="spacer"></div><button class="btn btn-primary btn-sm" data-action="add-duty-group">新增值日组</button></div>';h+='<div style="margin-bottom:10px;font-size:13px;color:var(--text2)">岗位：'+S.settings.dutyPositions.map(function(p){return'<span class="tag-chip">'+esc(p)+'</span>';}).join('')+'</div>';var wd=S.duty.filter(function(d){return d.week===ws;});if(!wd.length){h+='<div class="empty-state"><p>本周暂无值日安排</p></div>';}else{wd.forEach(function(d){var gs=getGroupStu(d.group);h+='<div class="duty-group"><div class="duty-group-header"><span class="duty-group-title">第'+d.group+'组</span><span class="data-count-badge">'+gs.length+'人</span><div class="spacer"></div>';var inc=d.tasks.filter(function(t){return!t.completed;}).length;if(inc===0&&d.tasks.length>0)h+='<span class="badge badge-low">已完成</span>';if(inc>0)h+='<button class="btn btn-outline btn-sm" data-action="sync-duty-points" data-id="'+d.id+'">同步积分</button>';h+='<button class="btn btn-ghost btn-sm" data-action="delete-duty" data-id="'+d.id+'">删除</button></div><div class="duty-tasks">';d.tasks.forEach(function(t,idx){var sn=t.assigneeId?getStuName(t.assigneeId):'未分配';h+='<div class="duty-task'+(t.completed?' done':'')+'"><div class="dt-check" data-action="toggle-duty" data-id="'+d.id+'" data-idx="'+idx+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg></div><span style="font-weight:500">'+esc(t.position)+'</span><span style="color:var(--text2);margin-left:auto">'+esc(sn)+'</span></div>';});h+='</div><div style="margin-top:8px"><button class="btn btn-ghost btn-sm" data-action="add-duty-task" data-id="'+d.id+'">+ 添加岗位</button></div></div>';});}c.innerHTML+=h;}
function showAddDutyGroup(){var groups=Object.keys(getGroups());var b='<div class="form-group"><label>值日组</label><select id="df-group">';groups.forEach(function(g){b+='<option value="'+g+'">第'+g+'组 ('+getGroupStu(parseInt(g)).length+'人)</option>';});b+='</select></div><div class="form-group"><label>值日岗位</label>';S.settings.dutyPositions.forEach(function(p){b+='<div class="checkbox-wrap"><input type="checkbox" value="'+esc(p)+'" checked>'+esc(p)+'</div>';});b+='</div>';openModal('新增值日组',b,'<button class="btn btn-primary" data-action="save-duty-group">添加</button><button class="btn btn-ghost" data-action="modal-close">取消</button>');}

function showAddDutyTask(id){var b='<div class="form-group"><label>岗位名称</label><input id="dtf-position"></div><div class="form-group"><label>负责人</label><select id="dtf-assignee"><option value="">未分配</option>';S.students.forEach(function(s){b+='<option value="'+s.id+'">'+esc(s.name)+'</option>';});b+='</select></div>';openModal('添加值日岗位',b,'<button class="btn btn-primary" data-action="save-duty-task" data-id="'+id+'">添加</button><button class="btn btn-ghost" data-action="modal-close">取消</button>');}
function saveDutyTask(id){var pos=val('dtf-position');if(!pos){toast('请输入岗位','error');return;}var aid=val('dtf-assignee');var d=S.duty.find(function(x){return x.id===id;});if(d)d.tasks.push({position:pos,assigneeId:aid||null,completed:false});save();closeModal();renderDuty();}
function toggleDuty(id,idx){var d=S.duty.find(function(x){return x.id===id;});if(d&&d.tasks[idx]){d.tasks[idx].completed=!d.tasks[idx].completed;save();renderDuty();}}

function importGradesRows(rows,meta){
  if(!rows||!rows.length){toast('文件中没有数据','warn');return;}
  var examName=meta.examName,date=meta.date||todayStr(),defaultSubject=meta.defaultSubject,srcName=meta.srcName;
  // 0. 建立学生索引（学号->学生、姓名->学生、重名标记）
  var byNo={},byName={},dupNames={};
  S.students.forEach(function(s){
    if(s.studentNo)byNo[String(s.studentNo).trim()]=s;
    if(byName[s.name])dupNames[s.name]=true;else byName[s.name]=s;
  });
  // 1. 表头识别（前3行内找含 姓名/名字/学号/考号/学生 的行）
  var nameIdx=-1,noIdx=-1,start=0,hasHeader=false;
  for(var hr=0;hr<Math.min(rows.length,3);hr++){
    var line=rows[hr].map(function(x){return String(x==null?'':x).trim();});
    var joined=line.join(',');
    if(/姓名|名字|学号|考号|编号|学生/.test(joined)){
      hasHeader=true;start=hr+1;
      rows[hr].forEach(function(cell,ci){
        var c=String(cell==null?'':cell).trim().replace(/\s+/g,'');
        if(!c)return;
        if(nameIdx<0&&/姓名|名字|学生/.test(c)&&!/学号|考号/.test(c))nameIdx=ci;
        if(noIdx<0&&/学号|考号|学籍号|编号/.test(c))noIdx=ci;
      });
      break;
    }
  }
  var subjectCols=[];
  if(!hasHeader){
    // 2a. 无表头：自动找最像「姓名」的列（命中学生数最多的列）
    var bestIdx=0,bestHit=0;
    for(var ci=0;ci<rows[0].length;ci++){
      var hit=0;
      for(var ri=0;ri<rows.length;ri++){
        var cv=String(rows[ri][ci]==null?'':rows[ri][ci]).trim();
        if(cv&&byName[cv]&&!dupNames[cv])hit++;
      }
      if(hit>bestHit){bestHit=hit;bestIdx=ci;}
    }
    nameIdx=bestIdx;noIdx=-1;
    // 其余数字列：第1个用所选科目，其余按「科目N」
    var colN=0;
    for(var ci3=0;ci3<rows[0].length;ci3++){
      if(ci3===nameIdx)continue;
      var hasNum=false;
      for(var ri3=0;ri3<rows.length;ri3++){
        var v3=parseFloat(String(rows[ri3][ci3]==null?'':rows[ri3][ci3]).replace(/[%％]/g,''));
        if(!isNaN(v3)){hasNum=true;break;}
      }
      if(hasNum){colN++;subjectCols.push({idx:ci3,subject:colN===1?(defaultSubject||'成绩'):'科目'+colN});}
    }
  }else{
    // 2b. 有表头：科目列 = 非姓名/学号列，且表头非空、该列含数字、非统计类列名
    var header=rows[start-1];
    header.forEach(function(cell,ci){
      var c=String(cell==null?'':cell).trim().replace(/\s+/g,'');
      if(!c)return;
      if(ci===nameIdx||ci===noIdx)return;
      if(/姓名|名字|学号|考号|学籍号|编号|证号|学生/.test(c))return;
      if(/总分|排名|名次|平均|均分|等级|备注|序号|班级|学校|考场|评价|组别|小组|校次|班次|进退步|属性|缺考|实考|满分|最高|最低|标准差|优秀率|及格率|合格率|低分率/.test(c))return;
      var hasNum=false;
      for(var ri=start;ri<rows.length;ri++){
        var v=parseFloat(String(rows[ri][ci]==null?'':rows[ri][ci]).replace(/[%％]/g,''));
        if(!isNaN(v)){hasNum=true;break;}
      }
      if(hasNum){
        var scSubject=c;
        if(/分数|成绩|得分|总分/.test(c))scSubject=defaultSubject||c;
        subjectCols.push({idx:ci,subject:scSubject});
      }
    });
    // 若没识别出科目列，尝试「分数/成绩」类列
    if(!subjectCols.length){
      header.forEach(function(cell,ci){
        var c=String(cell==null?'':cell).trim().replace(/\s+/g,'');
        if(/分数|成绩|得分/.test(c))subjectCols.push({idx:ci,subject:defaultSubject||'成绩'});
      });
    }
  }
  if(!subjectCols.length){toast('未识别到成绩列，请检查表头（需要 姓名/学号 + 分数或科目列）','error');return;}
  // 3. 逐科目导入
  var created=0,matched=0,unmatched=[],firstId=null;
  subjectCols.forEach(function(sc){
    var scores={},cnt=0,unm=[];
    for(var i=start;i<rows.length;i++){
      var row=rows[i];if(!row)continue;
      var idv=nameIdx>=0?String(row[nameIdx]==null?'':row[nameIdx]).trim():'';
      var idn=noIdx>=0?String(row[noIdx]==null?'':row[noIdx]).trim():'';
      var raw=String(row[sc.idx]==null?'':row[sc.idx]).replace(/[%％]/g,'');
      var v=parseFloat(raw);
      if(isNaN(v))continue;
      if(!idv&&!idn)continue;
      var st=null;
      if(idn&&byNo[idn])st=byNo[idn];
      if(!st&&idv&&byName[idv]&&!dupNames[idv])st=byName[idv];
      if(!st){unm.push(idv||idn);continue;}
      scores[st.id]=v;cnt++;
    }
    if(!cnt)return;
    var id=uid();
    S.grades.push({id:id,examName:examName,subject:sc.subject,date:date,scores:scores});
    if(!firstId)firstId=id;
    created++;matched+=cnt;unmatched=unmatched.concat(unm);
  });
  if(!created){toast('未匹配到任何有效成绩，请检查姓名/学号是否与档案一致','error');return;}
  if(firstId)U.selectedExamId=firstId;

  // 4. 结果提示
  var msg='已导入 <b>'+created+'</b> 科成绩（'+(srcName||'成绩单')+'），共匹配 <b>'+matched+'</b> 人次。';
  var uniqueUnm=[];unmatched.forEach(function(n){if(n&&uniqueUnm.indexOf(n)<0)uniqueUnm.push(n);});
  if(uniqueUnm.length){
    msg+='<div style="margin-top:12px;color:var(--red)"><b>'+uniqueUnm.length+' 人未匹配（档案中找不到，已跳过）：</b><br>'+esc(uniqueUnm.slice(0,30).join('、'))+(uniqueUnm.length>30?' 等':'')+'</div>';
    msg+='<div style="margin-top:6px;font-size:12px;color:var(--text3)">请检查成绩单中的姓名/学号是否与「学生档案」一致。</div>';
  }
  openModal('导入结果',msg,'<button class="btn btn-primary" data-action="modal-close">知道了</button>');
}
// ===== 学情分析（进退步 / 优分率 / 辅导名单）=====
var SUBJ_FULL={语文:100,数学:100,英语:100,物理:100,化学:100,生物:50,政治:60,历史:60,地理:50,总分:520};
function parseFullExamSheet(rows,meta){
  if(!rows||!rows.length)return null;
  var hr=-1;
  for(var i=0;i<Math.min(rows.length,4);i++){
    var joined=rows[i].map(function(x){return String(x==null?'':x).trim();}).join(',');
    if(/姓名|名字/.test(joined)&&/校次/.test(joined)){hr=i;break;}
  }
  if(hr<0)return null;
  var header=rows[hr];
  var nameIdx=-1,noIdx=-1;
  for(var ci=0;ci<header.length;ci++){
    var c=String(header[ci]==null?'':header[ci]).trim().replace(/\s+/g,'');
    if(!c)continue;
    if(nameIdx<0&&/姓名|名字/.test(c)){nameIdx=ci;continue;}
    if(noIdx<0&&/考号|学号|编号/.test(c)){noIdx=ci;continue;}
  }
  if(nameIdx<0)return null;
  var nxt=function(j){return String(header[j]==null?'':header[j]).trim().replace(/\s+/g,'');};
  var subCols=[],subOrder=[];
  for(var ci2=0;ci2<header.length-1;ci2++){
    var c2=String(header[ci2]==null?'':header[ci2]).trim().replace(/\s+/g,'');
    if(!c2||ci2===nameIdx||ci2===noIdx)continue;
    if(/序号|姓名|名字|学号|考号|编号|学生|班级|学校|属性|组别|小组|备注|评价|考场|排名|名次|平均|均分|等级|标准差|优秀率|及格率|合格率|低分率|缺考|实考|满分|最高|最低|得分|次/.test(c2))continue;
    if(nxt(ci2+1)==='校次'){subCols.push({score:ci2,sr:ci2+1,sd:ci2+2,cr:ci2+3,cd:ci2+4});subOrder.push(c2);}
  }
  if(!subCols.length)return null;
  var byNo={},byName={},dup={};
  S.students.forEach(function(s){
    if(s.studentNo)byNo[String(s.studentNo).trim()]=s;
    if(byName[s.name])dup[s.name]=true;else byName[s.name]=s;
  });
  var students={},unmatched=[],matched=0;
  var fnum=function(v){var t=String(v==null?'':v);if(/缺考|不计排名|未扫|免考|病假/.test(t))return null;var n=parseFloat(t);return isNaN(n)?null:n;};
  for(var ri=hr+1;ri<rows.length;ri++){
    var row=rows[ri];if(!row)continue;
    var nm=String(row[nameIdx]==null?'':row[nameIdx]).trim();
    var no=String(noIdx>=0&&row[noIdx]!=null?String(row[noIdx]).trim():'');
    if(!nm&&!no)continue;
    var st=null;
    if(no){
      var tail=no.length>=2?no.slice(-2):no;
      var tailN=parseInt(tail,10);
      if(byNo[no])st=byNo[no];
      else if(byNo[tail])st=byNo[tail];
      else if(!isNaN(tailN)&&byNo[String(tailN)])st=byNo[String(tailN)];
    }
    if(!st&&nm&&byName[nm]&&!dup[nm])st=byName[nm];
    if(!st){unmatched.push(nm||no);continue;}
    var rec={no:no,s:{}};
    subCols.forEach(function(sc,si){
      rec.s[subOrder[si]]={sc:fnum(row[sc.score]),sr:fnum(row[sc.sr]),sd:fnum(row[sc.sd]),cr:fnum(row[sc.cr]),cd:fnum(row[sc.cd])};
    });
    students[st.id]=rec;matched++;
  }
  if(!matched)return null;
  var subs=subOrder.filter(function(x){return x!=='总分';});
  return {examName:meta.examName,date:meta.date||todayStr(),subjects:subs,students:students,unmatched:unmatched,matchCount:matched,newStudents:[]};
}
function importExamPayload(p){
  if(!p||!p.students)return {dup:true};
  if(S.exams.some(function(e){return e.name===p.examName&&e.date===p.date;}))return {dup:true};
  (p.newStudents||[]).forEach(function(ns){
    if(!S.students.some(function(x){return x.name===ns.name;}))S.students.push(ns);
  });
  var id=uid();
  S.exams.push({id:id,name:p.examName,date:p.date,subjects:p.subjects,students:p.students,stats:p.stats||null});
  (p.subjects||[]).concat(['总分']).forEach(function(sub){
    var sc={};
    Object.keys(p.students).forEach(function(sid){var v=p.students[sid].s[sub];if(v&&v.sc!=null)sc[sid]=v.sc;});
    if(Object.keys(sc).length)S.grades.push({id:uid(),examName:p.examName,subject:sub,date:p.date,scores:sc});
  });
  U.selectedExamAId=id;
  return {dup:false,id:id};
}
function importGradesSheets(sheets,meta){
  if(!sheets||!sheets.length){toast('未找到工作表数据','error');return;}
  var full=null;
  for(var i=0;i<sheets.length;i++){var p=parseFullExamSheet(sheets[i].rows,meta);if(p&&p.matchCount){full=p;break;}}
  if(full){
    var r=importExamPayload(full);
    if(r.dup){toast('「'+meta.examName+'」该考试已导入过，请修改考试名称或日期','warn');return;}
    save();closeModal();renderGradesMod();
    var msg='已导入 <b>'+esc(meta.examName)+'</b> 学情汇总表：<br>匹配 <b>'+full.matchCount+'</b> 名学生，覆盖 <b>'+full.subjects.length+'</b> 科 + 总分，含 校次/班次进退步。';
    if(full.unmatched.length)msg+='<div style="margin-top:12px;color:var(--red)"><b>'+full.unmatched.length+' 人未匹配（已跳过）：</b>'+esc(full.unmatched.join('、'))+'</div>';
    msg+='<div style="margin-top:8px;font-size:12px;color:var(--text3)">可到「成绩分析 → 学情分析」查看班级整体、个体进退步、优分率与辅导名单。</div>';
    openModal('导入结果',msg,'<button class="btn btn-primary" data-action="modal-close">知道了</button>');
    return;
  }
  var best=sheets[0];
  sheets.forEach(function(sh){if(sh.rows.length>best.rows.length)best=sh;});
  importGradesRows(best.rows,meta);
}
function examStatList(ex){
  var fulls=ex.stats||{};
  var out={subs:[],up:0,down:0,flat:0,ref:0,totalAvg:'-',totalExc:'-',totalPass:'-',totalLow:'-'};
  var totalArr=[];
  Object.keys(ex.students).forEach(function(sid){var rec=ex.students[sid];var t=rec.s['总分'];if(t&&t.sc!=null){totalArr.push(t.sc);if(t.cd>0)out.up++;else if(t.cd<0)out.down++;else if(t.cd===0)out.flat++;}});
  out.ref=totalArr.length;
  if(totalArr.length){var s=totalArr.reduce(function(a,b){return a+b;},0);out.totalAvg=(s/totalArr.length).toFixed(1);var exc=totalArr.filter(function(v){return v>=520*0.85;}).length;var pass=totalArr.filter(function(v){return v>=520*0.6;}).length;var low=totalArr.filter(function(v){return v<520*0.4;}).length;out.totalExc=(exc/totalArr.length*100).toFixed(1);out.totalPass=(pass/totalArr.length*100).toFixed(1);out.totalLow=(low/totalArr.length*100).toFixed(1);}
  ex.subjects.concat(['总分']).forEach(function(sub){
    var arr=[];
    Object.keys(ex.students).forEach(function(sid){var v=ex.students[sid].s[sub];if(v&&v.sc!=null)arr.push(v.sc);});
    var full=SUBJ_FULL[sub]||100;
    var row={sub:sub,full:full,n:arr.length,avg:'-',mx:'-',mn:'-',exc:'-',pass:'-',low:'-',rank:fulls[sub]?fulls[sub].rank:null};
    if(arr.length){var s2=arr.reduce(function(a,b){return a+b;},0);row.avg=(s2/arr.length).toFixed(1);row.mx=Math.max.apply(null,arr);row.mn=Math.min.apply(null,arr);var e2=arr.filter(function(v){return v>=full*0.85;}).length;var p2=arr.filter(function(v){return v>=full*0.6;}).length;var l2=arr.filter(function(v){return v<full*0.4;}).length;row.exc=(e2/arr.length*100).toFixed(1);row.pass=(p2/arr.length*100).toFixed(1);row.low=(l2/arr.length*100).toFixed(1);}
    out.subs.push(row);
  });
  return out;
}
function buildExamSuggestions(st){
  var tips=[];
  st.subs.forEach(function(r){
    if(r.n<1||r.sub==='总分')return;
    var t=[];
    if(r.pass!=='-'&&parseFloat(r.pass)<70)t.push('及格率偏低('+r.pass+'%)，需抓基础与补差');
    if(r.exc!=='-'&&parseFloat(r.exc)<10)t.push('优秀率偏低('+r.exc+'%)，有培优空间');
    if(r.low!=='-'&&parseFloat(r.low)>10)t.push('低分学生偏多('+r.low+'%)，建议一对一盯促');
    if(r.rank!=null&&r.rank>3)t.push('年级排名第'+r.rank+'名，可向同类班级取经');
    if(t.length)tips.push(r.sub+'：'+t.join('；'));
  });
  if(st.down>st.up)tips.push('班级整体有'+(st.down-st.up)+'人退步，注意近期学习状态与纪律');
  if(!tips.length)tips.push('本次各科整体均衡，保持现状并持续关注进退步学生即可');
  return tips;
}

function compressImg(file,cb){
  var r=new FileReader();
  r.onload=function(ev){
    var img=new Image();
    img.onload=function(){
      var canvas=document.createElement('canvas');
      var maxW=800,maxH=800;
      var w=img.width,h=img.height;
      if(w>h){if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}}else{if(h>maxH){w=Math.round(w*maxH/h);h=maxH;}}
      canvas.width=w;canvas.height=h;
      var ctx=canvas.getContext('2d');
      ctx.drawImage(img,0,0,w,h);
      var data=canvas.toDataURL('image/jpeg',0.7);
      if(data.length>500000)data=canvas.toDataURL('image/jpeg',0.45);
      cb(data);
    };
    img.onerror=function(){cb(null);};
    img.src=ev.target.result;
  };
  r.onerror=function(){cb(null);};
  r.readAsDataURL(file);
}

function setupImgUpload(areaId,prefix){
  var ua=document.getElementById(areaId);
  if(!ua)return;
  ua.onclick=function(){
    var fi=document.createElement('input');
    fi.type='file';
    fi.accept='image/*';
    fi.multiple=true;
    fi.onchange=function(ev){
      var files=Array.from(ev.target.files);
      var remaining=9-U.editImgs.length;
      if(remaining<=0){toast('最多9张图片','warn');return;}
      files=files.slice(0,remaining);
      if(!files.length)return;
      var done=0;
      toast('正在处理'+files.length+'张图片...','info');
      files.forEach(function(f){
        compressImg(f,function(data){
          if(data)U.editImgs.push(data);
          done++;
          if(done===files.length){
            renderFormImgs(prefix==='act'?'actImgGrid':'behImgGrid',U.editImgs,prefix);
            toast('已添加'+done+'张图片','success');
          }
        });
      });
    };
    fi.click();
  };
}
function renderFormImgs(containerId,imgs,prefix){
  var el=document.getElementById(containerId);
  if(!el)return;
  if(!imgs.length){el.innerHTML='';return;}
  el.innerHTML=imgs.map(function(img,idx){
    return '<div class="form-img-wrap"><img class="form-img-thumb" src="'+img+'"><button class="form-img-del" data-action="del-form-img" data-prefix="'+prefix+'" data-idx="'+idx+'">&times;</button></div>';
  }).join('');
}

  if(a==='exp-todos-csv'){var csv=toCSV([['标题','内容','截止时间','优先级','分类','状态']].concat(S.todos.map(function(t){return[t.title,t.content,t.deadline,t.priority,t.category,t.completed?'已完成':'进行中'];})));dl('待办清单.csv','\uFEFF'+csv,'text/csv;charset=utf-8');closeModal();return;}
  if(a==='exp-grades-csv'){var g=S.grades.find(function(x){return x.id===U.selectedExamId;})||S.grades[0];if(!g){toast('暂无成绩','warn');return;}var csv=toCSV([['排名','姓名','组别','分数']].concat(Object.entries(g.scores).map(function(a,i){var st=getStu(a[0]);return[i+1,st?st.name:a[0],st?st.group:'?',a[1]];})));dl('成绩报表.csv','\uFEFF'+csv,'text/csv;charset=utf-8');closeModal();return;}
  if(a==='exp-points-csv'){var csv=toCSV([['日期','学生','类型','分值','原因']].concat(S.points.map(function(p){return[p.date,getStuName(p.studentId),p.type==='add'?'加分':'扣分',p.points,p.reason];})));dl('积分明细.csv','\uFEFF'+csv,'text/csv;charset=utf-8');closeModal();return;}
  
  if(a==='imp-json'){var fi=document.createElement('input');fi.type='file';fi.accept='.json';fi.onchange=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(ev){try{var d=JSON.parse(ev.target.result);['students','todos','schedule','seating','duty','violations','communications','grades','homework','points','drafts','activities','behaviors','committee','settings'].forEach(function(k){if(d[k])S[k]=d[k];});save();closeModal();renderMod(U.module);toast('已恢复','success');}catch(err){toast('文件格式错误','error');}};r.readAsText(f,'UTF-8');};fi.click();return;}
  
  if(a==='complete-todo'){var t=S.todos.find(function(x){return x.id===id;});if(t){t.completed=true;save();renderTodos();renderToday();toast('已完成','success');}return;}
  if(a==='nav-arrange'){U.arrangeTab='duty';nav('arrange');return;}
});

// Today toggle
document.getElementById('todayHeader').addEventListener('click',function(){document.getElementById('todaySection').classList.toggle('collapsed');});
// Sidebar toggle
document.getElementById('menuToggle').addEventListener('click',function(){document.getElementById('sidebar').classList.toggle('open');document.getElementById('sidebarOverlay').classList.toggle('active');});
document.getElementById('sidebarOverlay').addEventListener('click',function(){document.getElementById('sidebar').classList.remove('open');document.getElementById('sidebarOverlay').classList.remove('active');});
document.getElementById('modalClose').addEventListener('click',closeModal);
document.getElementById('modal').addEventListener('click',function(e){if(e.target===this)closeModal();});
document.getElementById('btnExport').addEventListener('click',showExportMenu);
document.getElementById('btnImport').addEventListener('click',showImportMenu);
document.getElementById('btnSettings').addEventListener('click',showSettings);
document.getElementById('btnDrafts').addEventListener('click',showDrafts);

// Search
document.getElementById('globalSearch').addEventListener('input',function(e){
  var q=e.target.value.trim();var sr=document.getElementById('searchResults');
  if(!q){sr.classList.remove('show');return;}
  var results=S.students.filter(function(s){return s.name.indexOf(q)>=0;});
  if(!results.length){sr.innerHTML='<div class="search-item" style="color:var(--text3)">未找到学生</div>';}
  else{sr.innerHTML=results.map(function(s){return'<div class="search-item" data-action="search-click" data-id="'+s.id+'"><b>'+esc(s.name)+'</b><span class="si-tag">'+esc(s.gender)+' · 第'+s.group+'组</span>'+(s.tags&&s.tags.length?'<span class="si-tag">'+esc(s.tags.join('/'))+'</span>':'')+'</div>';}).join('');}
  sr.classList.add('show');
});
document.getElementById('searchResults').addEventListener('click',function(e){
  var item=e.target.closest('.search-item[data-action="search-click"]');
  if(!item)return;
  U.selectedProfileId=item.dataset.id;
  nav('profiles');
  document.getElementById('globalSearch').value='';
  document.getElementById('searchResults').classList.remove('show');
});

// ===== INIT =====
if(!load()){initSampleData();}
renderMod('todos');
renderToday();
})();
</script>
</body>
</html>
